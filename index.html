<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JEYA SOUND — Mixing &amp; Mastering</title>
<meta name="description" content="Mixing, mastering and recording by engineer JEYA. Listen to before &amp; after, check the rates and send a request in two minutes.">
<meta property="og:title" content="JEYA SOUND — Mixing &amp; Mastering">
<meta property="og:description" content="Mixing, mastering and recording by engineer JEYA.">
<meta name="theme-color" content="#0a0b1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Gowun+Dodum&family=Nanum+Pen+Script&family=Nunito:wght@400;600;700&family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b1c;--bg2:#0f1128;--line:#d3e1ff;--ink:#eceaff;--dim:#9ca3c6;--faint:rgba(200,210,255,.15);--acc:#bcb6ff;--g1:#a6d6ff;--g2:#c9b0ff;--grad:linear-gradient(90deg,var(--g1),var(--g2));--err:#ff93a8;
  --sans:"Nunito","Gowun Dodum",system-ui,sans-serif;--serif:"Caveat","Nanum Pen Script",cursive;--hs:1.22;--logo:"Caveat",cursive;--pad:clamp(16px,5vw,88px)}
/* headings handwritten, body soft and easy to read; each language gets fonts made for its own script */
:lang(ko){--sans:"Gowun Dodum","Nunito",system-ui,sans-serif;--serif:"Nanum Pen Script","Caveat",cursive;--hs:1.32}
:lang(ja){--sans:"Zen Maru Gothic","Nunito",system-ui,sans-serif;--serif:"Yomogi","Caveat",cursive;--hs:.84}
:lang(ja) h1,:lang(ja) h2,:lang(ja) h3,:lang(ja) p{word-break:auto-phrase}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);scroll-behavior:smooth}
body{background:radial-gradient(1200px 700px at 85% 0%,rgba(150,130,255,.07),transparent 70%) fixed,var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
:lang(ja) body{line-break:strict;word-break:normal}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.15;text-wrap:balance}
p{text-wrap:pretty}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;align-items:center;gap:20px;padding:16px var(--pad);transition:background .3s}
header.solid{background:rgba(10,11,28,.92);border-bottom:1px solid var(--faint)}
.logo{font-family:var(--logo);font-weight:700;font-size:24px;letter-spacing:.04em;text-decoration:none;white-space:nowrap;line-height:1}
nav.main{display:flex;gap:22px;margin-left:auto;font-size:14px}
nav.main a{text-decoration:none;color:var(--dim)}nav.main a:hover{color:var(--ink)}
.langs{display:flex;border:1px solid var(--faint);border-radius:999px;padding:3px}
.langs button{background:none;border:0;color:var(--dim);font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer;min-height:32px}
.langs button[aria-pressed=true]{background:var(--grad);color:#0b0c1e}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border:1.5px solid rgba(200,210,255,.42);background:transparent;color:var(--ink);white-space:nowrap;font-family:var(--sans);transition:box-shadow .4s,border-color .4s,filter .4s}
.btn.pri{background:var(--grad);color:#0b0c1e;border-color:transparent}
.btn:hover{border-color:#d9ccff;box-shadow:0 0 20px rgba(170,160,255,.3)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.lit{box-shadow:0 0 0 1px rgba(201,176,255,.5),0 0 30px 4px rgba(170,160,255,.45)}
.btn.sm{min-height:40px;padding:0 18px;font-size:13px}
#bar{position:fixed;inset:0 0 auto 0;height:2px;background:var(--grad);transform-origin:0 0;transform:scaleX(0);z-index:50}

/* intro */
#intro{position:relative;height:700svh}
.stage{position:sticky;top:0;height:100svh;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,11,28,.85) 0%,rgba(10,11,28,.35) 32%,transparent 55%);pointer-events:none}
.cap{position:absolute;left:var(--pad);top:26svh;max-width:420px;transition:opacity .4s}
.cap h2{font-size:clamp(30px,3.6vw,52px);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cap p{margin-top:12px;color:var(--dim);font-size:15px;max-width:22em}
.scrollhint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;color:var(--dim);opacity:var(--hint,1)}
.veil{position:absolute;inset:0;background:var(--bg);opacity:var(--veil,0);pointer-events:none}
.hero{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);opacity:var(--heroO,0);visibility:hidden}
.hero .cta{opacity:var(--tg,0)}
.hero.on{visibility:visible}
.wordmark{width:min(620px,86vw);margin:0}
.wordmark svg{display:block;width:100%;height:auto;overflow:visible}
.wordmark text{font-family:var(--logo);font-weight:700;font-size:100px;fill:rgba(236,232,255,var(--wf,0));stroke:url(#skg);stroke-width:1.3;stroke-dasharray:900;stroke-dashoffset:calc(900*(1 - var(--ww,0)))}
.tagline{font-family:"Nunito",sans-serif;font-size:clamp(16px,1.6vw,20px);letter-spacing:.2em;color:var(--dim);margin-top:6px;padding-left:6px;opacity:var(--tg,0)}
.cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.loader{position:absolute;left:var(--pad);bottom:24px;font-size:12px;color:var(--dim);opacity:var(--load,1);transition:opacity .4s}

/* sections */
section.blk{scroll-margin-top:56px;padding:clamp(72px,10vw,128px) var(--pad);border-top:1px solid var(--faint)}
.head{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:4px 16px;margin-bottom:clamp(28px,4vw,48px)}
.head .no{font-family:var(--logo);color:var(--acc);font-size:22px}
.head h2{font-size:calc(clamp(28px,3.4vw,46px)*var(--hs))}
.head p{grid-column:1/-1;color:var(--dim);max-width:40em;margin-top:6px}
.wrap{max-width:1180px}

/* sketch-line panels (same line language as the intro) */
.panel{border:1px solid rgba(200,210,255,.38);border-radius:14px 10px 15px 9px;padding:clamp(18px,2.4vw,28px);background:var(--bg2)}

/* before & after: waveform player */
.ba{padding:clamp(16px,2.4vw,28px)}
.baTop{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bigplay{width:58px;height:58px;border-radius:50%;border:0;background:var(--grad);cursor:pointer;display:grid;place-items:center;flex:none;transition:box-shadow .4s}
.bigplay:hover{box-shadow:0 0 20px rgba(170,160,255,.4)}
.bigplay.lit{box-shadow:0 0 0 6px rgba(190,180,255,.12),0 0 26px rgba(170,160,255,.5)}
.bigplay svg{width:20px;height:20px}
.baInfo{flex:1;min-width:140px}
.baT{font-family:var(--serif);font-size:calc(clamp(20px,2.2vw,26px)*var(--hs))}
.baTime{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.sw{display:flex;border:1px solid rgba(200,210,255,.35);border-radius:999px;padding:3px}
.sw button{background:none;border:0;color:var(--dim);font-size:13px;font-weight:600;letter-spacing:.06em;padding:0 16px;min-height:40px;border-radius:999px;cursor:pointer}
.sw button[aria-pressed=true]{background:var(--grad);color:#0b0c1e}
#wave{display:block;width:100%;height:clamp(150px,18vw,220px);margin:18px 0 14px;cursor:pointer;touch-action:pan-y}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid rgba(200,210,255,.28);color:var(--dim);border-radius:999px;padding:0 16px;min-height:40px;font-size:14px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--acc);background:rgba(190,180,255,.08)}
.note{color:var(--dim);font-size:14px;margin-top:14px;min-height:1.4em}

/* ---- full-page motion: one cable runs through every section, boxes are drawn as you scroll ---- */
#flow{position:relative}
#flow>section{position:relative;z-index:1}
#spine{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
#spine path{fill:none;stroke-linecap:round}
#spineGlow{stroke:url(#spg);stroke-width:7;opacity:.13}
#spineP{stroke:url(#spg);stroke-width:1.7}
#spineDot{fill:#efe9ff;filter:drop-shadow(0 0 6px #c9b0ff)}
#spineEnd{fill:none;stroke:url(#spg);stroke-width:1.6;opacity:0;transition:opacity .4s}
#spine.linked #spineEnd{opacity:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:4;filter:drop-shadow(0 0 8px #c9b0ff)}}
.panel,.photo{position:relative}
.sk{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.sk path{fill:none;stroke:url(#skg);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1}
html.mo .panel,html.mo .photo{border-color:transparent}
html.mo .head{column-gap:26px}
.ico{display:block;width:56px;height:42px;margin-bottom:10px;overflow:visible}
.ico path,.lp path,.lp circle{fill:none;stroke:url(#skg);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
html.mo .ico path,html.mo .lp .d{stroke-dasharray:1 1;stroke-dashoffset:1}
.lp{display:block;width:120px;height:120px;margin:0 auto 18px;overflow:visible}
.lp g.spin{transform-origin:60px 60px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fld .ul{display:block;height:1.5px;margin-top:-7px;border-radius:2px;background:var(--grad);transform-origin:0 50%;transform:scaleX(var(--u,1));opacity:.9}
html.mo .fld input{border-color:rgba(200,210,255,.16)}
#engName{clip-path:inset(-10% calc((1 - var(--n,1))*100%) -10% 0)}
/* cursor (mouse only) */
html.cur,html.cur *{cursor:none!important}
html.cur input,html.cur textarea{cursor:text!important}
#cur{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:9999}

/* process */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;list-style:none;padding:0}
.steps li{position:relative}
.steps .n{font-family:var(--logo);font-size:36px;color:var(--acc);line-height:1}
.steps h3{font-size:calc(21px*var(--hs));margin:14px 0 8px}
.steps p{color:var(--dim);font-size:15px}

/* rates */
.rates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rate{display:flex;flex-direction:column;gap:8px}
.rate .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rate h3{font-size:calc(22px*var(--hs))}
.rate .price{font-family:var(--sans);font-weight:700;font-size:clamp(22px,2.3vw,28px);white-space:nowrap;font-variant-numeric:tabular-nums}
.rate .unit{font-size:13px;color:var(--dim);text-align:right}
.rate .inc{color:var(--dim);font-size:15px}
.rate .alt{color:var(--acc);font-size:14px}
.ratesNote{margin-top:20px;color:var(--dim);white-space:pre-line;font-size:15px}

/* engineer */
.eng{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.photo{aspect-ratio:4/5;border-radius:14px 10px 15px 9px;border:1px solid rgba(200,210,255,.38);overflow:hidden;background:var(--bg2);display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo span{font-family:var(--serif);font-size:56px;color:rgba(200,210,255,.4)}
.eng h3{font-family:var(--logo);font-weight:700;font-size:clamp(34px,3.6vw,48px)}
.eng .role{color:var(--acc);margin:6px 0 18px}
.eng .bio{white-space:pre-line;max-width:36em}
.eng .sess{margin-top:14px;color:var(--dim)}
.gear{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 24px;list-style:none;padding:0}
.gear li{border-top:1px solid var(--faint);padding-top:8px}
.gear b{display:block;font-size:12px;color:var(--dim);font-weight:400}

/* discography */
.discs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;list-style:none;padding:0}
.disc .cv{aspect-ratio:1;border-radius:10px 8px 11px 7px;border:1px solid rgba(200,210,255,.38);overflow:hidden;background:var(--bg2);display:grid;place-items:center}
.disc .cv img{width:100%;height:100%;object-fit:cover}
.disc .cv span{font-family:var(--serif);font-size:42px;color:rgba(200,210,255,.35)}
.disc h3{font-size:calc(18px*var(--hs));margin-top:10px}
.disc p{font-size:14px;color:var(--dim)}
.soon{color:var(--dim);text-align:center;padding:40px 20px;font-family:var(--serif);font-size:calc(21px*var(--hs))}
[hidden]{display:none!important}
.plugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.plug{display:flex;flex-direction:column;gap:12px}
.plug .pimg{aspect-ratio:16/10;border-radius:10px 8px 11px 7px;overflow:hidden;background:var(--bg);border:1px solid var(--faint);display:grid;place-items:center}
.plug .pimg img{width:100%;height:100%;object-fit:cover}
.plug .pimg svg{width:60%;opacity:.7}
.plug .ptop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plug h3{font-size:calc(24px*var(--hs))}
.chip{font-size:12px;border:1px solid rgba(200,210,255,.35);border-radius:999px;padding:2px 10px;color:var(--dim);white-space:nowrap}
.chip.sale{color:#0b0c1e;background:var(--grad);border-color:transparent}
.plug .pdesc{color:var(--dim);white-space:pre-line}
.plug .pfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:auto}
.plug .pprice{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.plw{display:block;width:min(220px,70%);margin:0 auto 18px;overflow:visible}
.plw path{fill:none;stroke:url(#skg);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
html.mo .plw .d{stroke-dasharray:1 1;stroke-dashoffset:1}

/* booking */
form.book{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px;max-width:880px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1/-1}
.fld label{font-weight:600;font-size:15px}
.fld label em{font-style:normal;color:var(--acc);font-weight:400;font-size:13px;margin-left:6px}
.fld input{background:var(--bg);border:1px solid rgba(200,210,255,.35);border-radius:10px;padding:13px 14px;color:var(--ink);font:inherit;font-size:16px;min-height:50px}
.fld input:focus{border-color:var(--acc);outline:none}
.fld input[aria-invalid=true]{border-color:var(--err)}
.fld .hint{font-size:13px;color:var(--dim)}
.fld .err{font-size:13px;color:var(--err);min-height:0}
.fld .err:empty{display:none}
.formfoot{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:6px}
.formfoot small{color:var(--dim)}
.msg{grid-column:1/-1;font-size:15px}
.msg.ok{color:var(--acc)}.msg.bad{color:var(--err)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
form.book.done .fld,form.book.done .formfoot{opacity:.45;pointer-events:none}

#mcta{display:none}
footer{padding:40px var(--pad) 56px;border-top:1px solid var(--faint);color:var(--dim);font-size:14px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}

@media (max-width:900px){nav.main{display:none}.langs{margin-left:auto}}
@media (max-width:820px){
  .ba,.eng{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.rates{grid-template-columns:1fr}
  form.book{grid-template-columns:1fr}
  .eng .photo{max-width:240px}
}
@media (max-aspect-ratio:85/100){
  .shade{background:linear-gradient(180deg,rgba(10,11,28,.9) 0%,rgba(10,11,28,.4) 26%,transparent 44%)}
  .hero{justify-content:flex-start;padding-top:16svh}
  header .btn{display:none}
  #mcta{display:flex;justify-content:center;position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:45;transition:transform .3s,opacity .3s}
  #mcta.off{transform:translateY(140%);opacity:0;pointer-events:none}
  footer{padding-bottom:110px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#intro{height:100svh}}
</style>
</head>
<body>
<div id="bar"></div>
<header id="hdr">
  <a class="logo" href="#top">JEYA SOUND</a>
  <nav class="main" aria-label="Sections">
    <a href="#ba" data-t="navBA"></a><a href="#process" data-t="navProcess"></a><a href="#rates" data-t="navRates"></a><a href="#work" data-t="navWork" id="navWork"></a><a href="#plugins" data-t="navPlugins"></a><a href="#about" data-t="navAbout"></a>
  </nav>
  <div class="langs" role="group" aria-label="Language"><button data-l="ko">KR</button><button data-l="ja">JP</button><button data-l="en">EN</button></div>
  <a class="btn pri sm" href="#book" data-t="ctaShort"></a>
</header>

<main id="top">
  <div id="intro">
    <div class="stage" id="stage">
      <canvas id="cv" aria-hidden="true"></canvas>
      <div class="shade"></div>
      <div class="veil"></div>
      <div class="hero" id="hero">
        <h1 class="wordmark"><svg viewBox="0 0 460 120" role="img" aria-label="JEYA SOUND"><text x="4" y="88" textLength="448" lengthAdjust="spacingAndGlyphs">JEYA SOUND</text></svg></h1>
        <p class="tagline">Mixing · Mastering</p>
        <div class="cta"><a class="btn pri" href="#book" data-t="ctaBook"></a><a class="btn sec" href="#ba" data-t="ctaListen"></a></div>
      </div>
    </div>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="skg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a6d6ff"/><stop offset="1" stop-color="#c9b0ff"/></linearGradient></defs></svg>
  <div id="flow">
  <svg id="spine" aria-hidden="true"><defs><linearGradient id="spg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1000"><stop offset="0" stop-color="#a6d6ff"/><stop offset="1" stop-color="#c9b0ff"/></linearGradient></defs>
    <path id="spineGlow"/><path id="spineP"/><circle id="spineEnd" r="9"/><circle id="spineDot" r="3.2"/></svg>
  <section class="blk" id="ba" aria-labelledby="baH">
    <div class="wrap">
      <div class="head"><span class="no">01</span><h2 id="baH" data-t="baTitle"></h2><p data-t="baNote"></p></div>
      <div class="ba panel">
        <div class="baTop">
          <button class="bigplay" id="baPlay"></button>
          <div class="baInfo"><div class="baT" id="baTitle"></div><div class="baTime" id="baTime">0:00 / 0:00</div></div>
          <div class="sw" id="baSw" role="group"><button data-m="before"></button><button data-m="after"></button></div>
        </div>
        <canvas id="wave" aria-hidden="true"></canvas>
        <div class="tabs" id="tracks" role="tablist"></div>
        <p class="note" id="now"></p>
      </div>
    </div>
  </section>

  <section class="blk" id="process" aria-labelledby="prH">
    <div class="wrap">
      <div class="head"><span class="no">02</span><h2 id="prH" data-t="prTitle"></h2></div>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <section class="blk" id="rates" aria-labelledby="rtH">
    <div class="wrap">
      <div class="head"><span class="no">03</span><h2 id="rtH" data-t="rtTitle"></h2></div>
      <div class="rates" id="rateList"></div>
      <p class="ratesNote" id="ratesNote"></p>
      <div class="cta"><a class="btn pri" href="#book" data-t="ctaRates"></a></div>
    </div>
  </section>

  <section class="blk" id="work" aria-labelledby="wkH">
    <div class="wrap">
      <div class="head"><span class="no">04</span><h2 id="wkH" data-t="wkTitle"></h2></div>
      <ul class="discs" id="discs"></ul><div class="soon panel" id="soonBox"><svg class="lp" viewBox="0 0 120 120" aria-hidden="true"><g class="spin">
        <circle class="d" cx="60" cy="60" r="56" pathLength="1"/><circle class="d" cx="60" cy="60" r="46" pathLength="1" opacity=".5"/><circle class="d" cx="60" cy="60" r="38" pathLength="1" opacity=".35"/><circle class="d" cx="60" cy="60" r="30" pathLength="1" opacity=".5"/>
        <circle class="d" cx="60" cy="60" r="15" pathLength="1"/><circle cx="60" cy="60" r="2"/><path class="d" d="M60 8 A52 52 0 0 1 104 34" pathLength="1" opacity=".8"/></g></svg><p id="soon" data-t="wkSoon"></p></div>
    </div>
