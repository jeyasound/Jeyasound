<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JEYA SOUND — Mixing &amp; Mastering</title>
<meta name="description" content="Mixing, mastering and recording by engineer JEYA. Listen to before &amp; after, check the rates and send a request in two minutes.">
<meta property="og:title" content="JEYA SOUND — Mixing &amp; Mastering">
<meta property="og:description" content="Mixing, mastering and recording by engineer JEYA.">
<meta name="theme-color" content="#0b0d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+KR:wght@400;600&family=Noto+Serif+JP:wght@500&family=Noto+Serif+KR:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--bg2:#10131a;--line:#e9dcc2;--ink:#efe6d4;--dim:#a49c8f;--faint:rgba(233,220,194,.18);--amber:#f0a83c;--amberD:#d98c25;--err:#ff8a70;
  --sans:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif;--serif:"Noto Serif KR","Noto Serif JP",serif;--pad:clamp(16px,5vw,88px)}
:lang(ja){--sans:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;--serif:"Noto Serif JP","Noto Serif KR",serif}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
:lang(ja) body{line-break:strict;word-break:normal}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.2;text-wrap:balance}
p{text-wrap:pretty}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;align-items:center;gap:20px;padding:16px var(--pad);transition:background .3s}
header.solid{background:rgba(11,13,18,.92);border-bottom:1px solid var(--faint)}
.logo{font-weight:600;letter-spacing:.18em;font-size:14px;text-decoration:none;white-space:nowrap}
nav.main{display:flex;gap:22px;margin-left:auto;font-size:14px}
nav.main a{text-decoration:none;color:var(--dim)}nav.main a:hover{color:var(--ink)}
.langs{display:flex;border:1px solid var(--faint);border-radius:999px;padding:3px}
.langs button{background:none;border:0;color:var(--dim);font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer;min-height:32px}
.langs button[aria-pressed=true]{background:var(--ink);color:#111}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn.pri{background:linear-gradient(180deg,#f6b955,var(--amberD));color:#1a1209;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sec{border-color:rgba(233,220,194,.4);color:var(--ink);background:transparent}
.btn.sm{min-height:38px;padding:0 16px;font-size:13px}
#bar{position:fixed;inset:0 0 auto 0;height:2px;background:var(--amber);transform-origin:0 0;transform:scaleX(0);z-index:50}

/* intro */
#intro{position:relative;height:520svh}
.stage{position:sticky;top:0;height:100svh;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,13,18,.85) 0%,rgba(11,13,18,.35) 32%,transparent 55%);pointer-events:none}
.cap{position:absolute;left:var(--pad);top:26svh;max-width:420px;transition:opacity .4s}
.cap h2{font-size:clamp(30px,3.6vw,52px);color:var(--line)}
.cap p{margin-top:12px;color:var(--dim);font-size:15px;max-width:22em}
.scrollhint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;color:var(--dim);opacity:var(--hint,1)}
.veil{position:absolute;inset:0;background:var(--bg);opacity:var(--veil,0);pointer-events:none}
.hero{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);opacity:var(--heroO,0);visibility:hidden}
.hero.on{visibility:visible}
.hero .role{color:var(--amber);font-size:15px;margin-bottom:18px}
.hero h1{font-size:clamp(38px,5.4vw,78px);max-width:14ch}
.hero h1 span{display:block;transform:translateY(calc(36px*(1 - var(--heroT,0))))}
.hero p.sub{margin-top:18px;color:var(--dim);max-width:30em;font-size:17px}
.cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.loader{position:absolute;left:var(--pad);bottom:24px;font-size:12px;color:var(--dim);opacity:var(--load,1);transition:opacity .4s}

/* sections */
section.blk{scroll-margin-top:56px;padding:clamp(72px,10vw,128px) var(--pad);border-top:1px solid var(--faint)}
.head{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:4px 16px;margin-bottom:clamp(28px,4vw,48px)}
.head .no{font-family:var(--serif);color:var(--amber);font-size:18px}
.head h2{font-size:clamp(28px,3.4vw,46px)}
.head p{grid-column:1/-1;color:var(--dim);max-width:40em;margin-top:6px}
.wrap{max-width:1180px}

/* sketch-line panels (same line language as the intro) */
.panel{border:1px solid rgba(233,220,194,.38);border-radius:14px 10px 15px 9px;padding:clamp(18px,2.4vw,28px);background:var(--bg2)}

/* before & after */
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:clamp(20px,3vw,40px);align-items:start}
.vu{display:flex;flex-direction:column;align-items:center;gap:10px}
.vu canvas{width:100%;max-width:420px;aspect-ratio:2/1.1}
.vu .now{font-size:14px;color:var(--dim);min-height:1.6em;text-align:center}
.tracks{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.trk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px}
.trk.playing{border-color:var(--amber)}
.play{width:46px;height:46px;border-radius:50%;border:1px solid rgba(233,220,194,.55);background:none;cursor:pointer;display:grid;place-items:center}
.play svg{width:16px;height:16px}
.trk .t{font-weight:600}
.trk .bar{height:3px;background:var(--faint);border-radius:2px;margin-top:8px;overflow:hidden}
.trk .bar i{display:block;height:100%;width:0;background:var(--amber)}
.sw{display:flex;border:1px solid rgba(233,220,194,.4);border-radius:999px;padding:3px}
.sw button{background:none;border:0;color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.06em;padding:0 12px;min-height:36px;border-radius:999px;cursor:pointer}
.sw button[aria-pressed=true]{background:var(--ink);color:#111}
.note{color:var(--dim);font-size:14px;margin-top:16px}
.unavail{color:var(--dim);font-size:14px}

/* process */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;list-style:none;padding:0}
.steps li{position:relative}
.steps .n{font-family:var(--serif);font-size:34px;color:var(--amber);line-height:1}
.steps h3{font-size:20px;margin:14px 0 8px}
.steps p{color:var(--dim);font-size:15px}

/* rates */
.rates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rate{display:flex;flex-direction:column;gap:8px}
.rate .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rate h3{font-size:22px}
.rate .price{font-family:var(--serif);font-size:clamp(24px,2.6vw,32px);white-space:nowrap}
.rate .unit{font-size:13px;color:var(--dim);text-align:right}
.rate .inc{color:var(--dim);font-size:15px}
.rate .alt{color:var(--amber);font-size:14px}
.ratesNote{margin-top:20px;color:var(--dim);white-space:pre-line;font-size:15px}

/* engineer */
.eng{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.photo{aspect-ratio:4/5;border-radius:14px 10px 15px 9px;border:1px solid rgba(233,220,194,.38);overflow:hidden;background:var(--bg2);display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo span{font-family:var(--serif);font-size:56px;color:rgba(233,220,194,.4)}
.eng h3{font-size:clamp(26px,3vw,38px)}
.eng .role{color:var(--amber);margin:6px 0 18px}
.eng .bio{white-space:pre-line;max-width:36em}
.eng .sess{margin-top:14px;color:var(--dim)}
.gear{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 24px;list-style:none;padding:0}
.gear li{border-top:1px solid var(--faint);padding-top:8px}
.gear b{display:block;font-size:12px;color:var(--dim);font-weight:400}

/* discography */
.discs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;list-style:none;padding:0}
.disc .cv{aspect-ratio:1;border-radius:10px 8px 11px 7px;border:1px solid rgba(233,220,194,.38);overflow:hidden;background:var(--bg2);display:grid;place-items:center}
.disc .cv img{width:100%;height:100%;object-fit:cover}
.disc .cv span{font-family:var(--serif);font-size:42px;color:rgba(233,220,194,.35)}
.disc h3{font-size:17px;margin-top:10px}
.disc p{font-size:14px;color:var(--dim)}

/* booking */
form.book{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px;max-width:880px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1/-1}
.fld label{font-weight:600;font-size:15px}
.fld label em{font-style:normal;color:var(--amber);font-weight:400;font-size:13px;margin-left:6px}
.fld input{background:var(--bg);border:1px solid rgba(233,220,194,.35);border-radius:10px;padding:13px 14px;color:var(--ink);font:inherit;font-size:16px;min-height:50px}
.fld input:focus{border-color:var(--amber);outline:none}
.fld input[aria-invalid=true]{border-color:var(--err)}
.fld .hint{font-size:13px;color:var(--dim)}
.fld .err{font-size:13px;color:var(--err);min-height:0}
.fld .err:empty{display:none}
.formfoot{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:6px}
.formfoot small{color:var(--dim)}
.msg{grid-column:1/-1;font-size:15px}
.msg.ok{color:var(--amber)}.msg.bad{color:var(--err)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
form.book.done .fld,form.book.done .formfoot{opacity:.45;pointer-events:none}

#mcta{display:none}
footer{padding:40px var(--pad) 56px;border-top:1px solid var(--faint);color:var(--dim);font-size:14px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}

@media (max-width:900px){nav.main{display:none}.langs{margin-left:auto}}
@media (max-width:820px){
  .ba,.eng{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.rates{grid-template-columns:1fr}
  form.book{grid-template-columns:1fr}
  .eng .photo{max-width:240px}
}
@media (max-aspect-ratio:85/100){
  .cap{top:96px;right:var(--pad);max-width:none}.cap p{display:none}
  .shade{background:linear-gradient(180deg,rgba(11,13,18,.9) 0%,rgba(11,13,18,.4) 26%,transparent 44%)}
  .hero{justify-content:flex-start;padding-top:22svh}
  header .btn{display:none}
  #mcta{display:flex;position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:45;transition:transform .3s,opacity .3s}
  #mcta.off{transform:translateY(140%);opacity:0;pointer-events:none}
  footer{padding-bottom:110px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#intro{height:100svh}}
</style>
</head>
<body>
<div id="bar"></div>
<header id="hdr">
  <a class="logo" href="#top">JEYA SOUND</a>
  <nav class="main" aria-label="Sections">
    <a href="#ba" data-t="navBA"></a><a href="#process" data-t="navProcess"></a><a href="#rates" data-t="navRates"></a><a href="#work" data-t="navWork" id="navWork"></a><a href="#about" data-t="navAbout"></a>
  </nav>
  <div class="langs" role="group" aria-label="Language"><button data-l="ko">KR</button><button data-l="ja">JP</button><button data-l="en">EN</button></div>
  <a class="btn pri sm" href="#book" data-t="ctaShort"></a>
</header>

<main id="top">
  <div id="intro">
    <div class="stage" id="stage">
      <canvas id="cv" aria-hidden="true"></canvas>
      <div class="shade"></div>
      <div class="cap" id="cap" aria-live="polite"><h2 id="capT"></h2><p id="capP"></p></div>
      <div class="scrollhint" data-t="hint"></div>
      <div class="loader" id="loader"></div>
      <div class="veil"></div>
      <div class="hero" id="hero">
        <p class="role" id="heroRole"></p>
        <h1><span data-t="h1a"></span><span data-t="h1b"></span></h1>
        <p class="sub" data-t="heroSub"></p>
        <div class="cta"><a class="btn pri" href="#book" data-t="ctaBook"></a><a class="btn sec" href="#ba" data-t="ctaListen"></a></div>
      </div>
    </div>
  </div>

  <section class="blk" id="ba" aria-labelledby="baH">
    <div class="wrap">
      <div class="head"><span class="no">01</span><h2 id="baH" data-t="baTitle"></h2><p data-t="baNote"></p></div>
      <div class="ba">
        <div class="vu panel"><canvas id="vu" width="840" height="460" aria-hidden="true"></canvas><p class="now" id="now"></p></div>
        <ul class="tracks" id="tracks"></ul>
      </div>
    </div>
  </section>

  <section class="blk" id="process" aria-labelledby="prH">
    <div class="wrap">
      <div class="head"><span class="no">02</span><h2 id="prH" data-t="prTitle"></h2></div>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <section class="blk" id="rates" aria-labelledby="rtH">
    <div class="wrap">
      <div class="head"><span class="no">03</span><h2 id="rtH" data-t="rtTitle"></h2></div>
      <div class="rates" id="rateList"></div>
      <p class="ratesNote" id="ratesNote"></p>
      <div class="cta"><a class="btn pri" href="#book" data-t="ctaRates"></a></div>
    </div>
  </section>

  <section class="blk" id="work" aria-labelledby="wkH" hidden>
    <div class="wrap">
      <div class="head"><span class="no">04</span><h2 id="wkH" data-t="wkTitle"></h2></div>
      <ul class="discs" id="discs"></ul>
    </div>
  </section>

  <section class="blk" id="about" aria-labelledby="abH">
    <div class="wrap eng">
      <div class="photo" id="photo"><span>J</span></div>
      <div>
        <h2 class="sr" id="abH" data-t="navAbout"></h2>
        <h3 id="engName"></h3><p class="role" id="engRole"></p>
        <p class="bio" id="engBio"></p><p class="sess" id="engSess"></p>
        <ul class="gear" id="gear"></ul>
      </div>
    </div>
  </section>

  <section class="blk" id="book" aria-labelledby="bkH">
    <div class="wrap">
      <div class="head"><span class="no" id="bookNo">05</span><h2 id="bkH" data-t="bkTitle"></h2><p data-t="bkLead"></p></div>
      <form class="book panel" id="form" novalidate>
        <div class="fld"><label for="f-name"><span data-t="fName"></span><em data-t="req"></em></label><input id="f-name" name="name" autocomplete="name" required aria-describedby="e-name"><span class="err" id="e-name"></span></div>
        <div class="fld"><label for="f-email"><span data-t="fEmail"></span><em data-t="req"></em></label><input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="e-email"><span class="err" id="e-email"></span></div>
        <div class="fld"><label for="f-phone"><span data-t="fPhone"></span><em data-t="req"></em></label><input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required aria-describedby="e-phone"><span class="err" id="e-phone"></span></div>
        <div class="fld"><label for="f-spotify" data-t="fSpotify"></label><input id="f-spotify" name="spotify" type="url" inputmode="url" placeholder="https://open.spotify.com/…" aria-describedby="h-spotify e-spotify"><span class="hint" id="h-spotify" data-t="spotifyHint"></span><span class="err" id="e-spotify"></span></div>
        <div class="fld full"><label for="f-link" data-t="fLink"></label><input id="f-link" name="link" type="url" inputmode="url" placeholder="https://drive.google.com/…" aria-describedby="h-link e-link"><span class="hint" id="h-link" data-t="linkHint"></span><span class="err" id="e-link"></span></div>
        <div class="hp" aria-hidden="true"><input id="f-website" name="website" tabindex="-1" autocomplete="off"></div>
        <div class="formfoot"><button class="btn pri" type="submit" id="send" data-t="submit"></button><small data-t="footNote"></small></div>
        <p class="msg" id="msg" role="status"></p>
      </form>
    </div>
  </section>
</main>
<a class="btn pri" id="mcta" href="#book" data-t="ctaBook"></a>
<footer><span>© JEYA SOUND</span><a id="mail" href="mailto:contact@jeyasound.com">contact@jeyasound.com</a></footer>

<script>
